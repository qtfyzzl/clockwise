name: PlatformIO Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio>=6.1"

      - name: Build firmware (esp32dev)
        run: |
          set -o pipefail
          pio run -d firmware/ -e esp32dev -v 2>&1 | tee /tmp/pio.log
        timeout-minutes: 20

      - name: Report build errors
        if: failure()
        run: |
          # 把关键错误用 ::error:: 前缀暴露到 GitHub annotations（可通过 API 读取）
          grep -nE "error:|fatal:|unable to access|tunnel failed|Could not|VCSBaseException|undefined reference" /tmp/pio.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- 日志末尾 ---"
          tail -30 /tmp/pio.log
        timeout-minutes: 5
