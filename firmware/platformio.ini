; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
name = Clockwise

[env:native]
platform = native
test_framework = unity
test_ignore = test_embedded
; cw-commons depends on Arduino; native tests include its pure C++ headers by path.
lib_ignore = cw-commons

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
; Arduino core 3.x (IDF5) produces a larger image than the 2.0.x builds this
; project shipped with; default 1.25MB app partition overflows. Clockwise does
; not use SPIFFS (the settings page is embedded in flash), so use 3MB app.
board_build.partitions = huge_app.csv
test_ignore = test_native
monitor_speed = 115200

; ---- 烧录配置 ----
; 这台成品板：CH340 的 RTS 接 EN（复位有效），DTR 没接 IO0（无法自动进下载模式）。
; 所以每次烧录前必须手动让 IO0 保持低电平（按 BOOT 或短接 IO0-GND），
; 然后由 esptool 做默认复位即可。
; 注意：不要加 --before no-reset —— 实测会让芯片永远停在正常启动，必然失败。
upload_speed = 460800
lib_deps = 
	https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git#3.0.12
	adafruit/Adafruit GFX Library@^1.10.1
	adafruit/Adafruit BusIO@^1.5.0
	SPI
	Wire
	ropg/ezTime@^0.8.3
	https://github.com/jnthas/Improv-WiFi-Library
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson@^6.21.2
	bitbank2/PNGdec@1.0.1
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<clockfaces/>
build_flags = 
	-D CW_FW_VERSION="\"1.4.4\""
	; 上游用 ${sysenv.FW_NAME}（由 CI 注入），本地/VS Code 图形界面构建时该变量为空，
	; 这里固定成 Clockwise，保证不开命令行也能直接编出可用固件。
	-D CW_FW_NAME="\"Clockwise\""
	; 打开 ESP 日志（默认 CORE_DEBUG_LEVEL=0 时库里的 ESP_LOGI 全被吞掉）。
	; 有了它，串口能看到实际生效的 HUB75 引脚，便于核对接线。
	; 验证完想省 flash 可以删掉这行。
	-D CORE_DEBUG_LEVEL=3
