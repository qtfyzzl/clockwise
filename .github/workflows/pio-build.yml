name: PlatformIO Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio>=6.1"

      - name: Build firmware (esp32dev)
        run: |
          pio run -d firmware/ -e esp32dev -v 2>&1 | tee /tmp/pio.log
        timeout-minutes: 20

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pio-build-log
          path: /tmp/pio.log
          if-no-files-found: ignore

      - name: Report build errors
        if: failure()
        run: |
          echo "--- 最后 60 行日志 ---"
          tail -60 /tmp/pio.log
        timeout-minutes: 5
